<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAI - Infinite Artificial Intelligence</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --input-bg: #2d2d2d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            background-color: #333333;
            align-self: flex-end;
            color: #ffffff;
        }

        .message.assistant {
            background-color: var(--surface-color);
            align-self: flex-start;
            border: 1px solid #333333;
        }

        .input-container {
            padding: 15px 20px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
        }

        .input-pill {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border-radius: 30px;
            padding: 8px 15px;
            width: 100%;
            max-width: 800px;
            border: 1px solid #444;
        }

        .plus-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            padding: 0 10px 0 0;
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        #user-input::placeholder {
            color: #888;
        }

        .send-pill-btn {
            background-color: var(--accent-color);
            border: none;
            color: #121212;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="chat-container" id="chat-container">
        <div class="message assistant">Hello William! IAI is online and ready. How can I help you with your project today?</div>
    </div>

    <div class="input-container">
        <div class="input-pill">
            <button class="plus-btn">+</button>
            <input type="text" id="user-input" placeholder="Ask IAI..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-pill-btn" onclick="sendMessage()">→</button>
        </div>
    </div>

    <!-- UI Handler script to connect user input to iai.js backend -->
    <script>
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        let client_message_history = [];

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Append user message to UI
            appendMessage(text, "user");
            userInput.value = "";
            
            client_message_history.push({ role: "user", content: text });

            // Show temporary loading status
            const loadingId = appendMessage("IAI is thinking...", "assistant loading");

            try {
                // Calls the handle_chat function defined in your external iai.js file
                const payload = { messages: client_message_history };
                const result = await handle_chat(payload, `Bearer ${CUSTOM_API_KEY}`);

                // Remove loading message
                document.getElementById(loadingId).remove();

                if (result.status === 200 && result.data.choices) {
                    const aiReply = result.data.choices[0].message.content;
                    appendMessage(aiReply, "assistant");
                    client_message_history.push({ role: "assistant", content: aiReply });
                } else {
                    appendMessage("Error: Received invalid response format.", "assistant");
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Error: " + error.message, "assistant");
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            const msgId = "msg-" + Date.now();
            msgDiv.id = msgId;
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgId;
        }
    </script>

    <!-- Correctly links to your lowercase script file iai.js -->
    <script src="iai.js"></script>
</body>
</html>
