<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAI - Infinite Artificial Intelligence</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background: #0e0e11; color: #e3e2e6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; z-index: 5; }
        .top-left { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 16px; color: #c4c6d0; }
        .icon-btn { background: none; border: none; color: #c4c6d0; font-size: 20px; cursor: pointer; }

        /* Main Workspace */
        .main-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        
        /* Initial Landing State */
        .sparkle-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #4285f4, #9b51e0, #e91e63, #fbbc05); clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%); margin-bottom: 24px; }
        .greeting { font-size: 28px; font-weight: 400; color: #e3e2e6; text-align: center; margin-bottom: 20px; }

        /* Chat Display Stream */
        #chat-stream { width: 100%; max-width: 680px; flex: 1; display: none; flex-direction: column; gap: 16px; overflow-y: auto; padding-bottom: 20px; }
        .msg-user { align-self: flex-end; background: #28292e; color: #e3e2e6; padding: 12px 18px; border-radius: 20px; max-width: 80%; line-height: 1.5; }
        .msg-ai { align-self: flex-start; background: transparent; color: #e3e2e6; padding: 12px 0; max-width: 90%; line-height: 1.6; }

        /* Floating Input Pill Locked to Bottom Screen */
        .input-container { 
            position: fixed;
            bottom: 0;
            left: 0;
            padding: 12px 20px 24px 20px; 
            display: flex; 
            justify-content: center; 
            width: 100%; 
            background: linear-gradient(to top, #0e0e11 80%, transparent); 
            z-index: 10;
        }
        .input-pill { width: 100%; max-width: 680px; background: #1e1f24; border-radius: 28px; display: flex; align-items: center; padding: 8px 16px; gap: 12px; }
        .plus-btn { background: none; border: none; color: #c4c6d0; font-size: 24px; cursor: pointer; padding: 4px; }
        input { flex: 1; background: none; border: none; color: #e3e2e6; font-size: 16px; outline: none; }
        input::placeholder { color: #8e9099; }
        .send-pill-btn { background: #2b6cb0; border: none; color: #fff; border-radius: 50%; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; cursor: pointer; }

        /* Sidebar Drawer */
        .drawer { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #17181c; transition: 0.3s; z-index: 100; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .drawer.active { left: 0; }
        .drawer h3 { color: #8e9099; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .history-list { list-style: none; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { padding: 10px; background: #232429; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 99; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <button class="icon-btn" onclick="toggleDrawer()">☰</button>
            <span>IAI Gateway ▾</span>
        </div>
        <button class="icon-btn" onclick="clearSession()">✏️</button>
    </div>

    <!-- History Drawer -->
    <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <h3>Saved History</h3>
        <ul class="history-list" id="history-list"></ul>
    </div>

    <!-- Main Workspace -->
    <div class="main-container" id="main-container">
        <div id="landing-view" style="display: flex; flex-direction: column; align-items: center;">
            <div class="sparkle-icon"></div>
            <div class="greeting">Hi William, let's get into it</div>
        </div>
        
        <div id="chat-stream"></div>
    </div>

    <!-- Floating Input Pill -->
    <div class="input-container">
        <div class="input-pill">
            <button class="plus-btn">+</button>
            <input type="text" id="user-input" placeholder="Ask IAI..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="send-pill-btn" onclick="sendMsg()">➔</button>
        </div>
    </div>

    <script src="iai.js"></script>
    <script>
        const STORAGE_KEY = "IAI_CHAT_HISTORY";

        document.addEventListener("DOMContentLoaded", () => {
            loadSavedHistory();
        });

        function toggleDrawer() {
            document.getElementById("drawer").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        async function sendMsg() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            document.getElementById("landing-view").style.display = "none";
            const stream = document.getElementById("chat-stream");
            stream.style.display = "flex";

            stream.innerHTML += `<div class="msg-user">${text}</div>`;
            input.value = "";
            stream.scrollTop = stream.scrollHeight;

            const payload = { messages: [{ role: "user", content: text }] };
            const authHeader = "Bearer sk-IAI-infinite-key";

            try {
                const response = await handle_chat(payload, authHeader);
                if (response.status === 200) {
                    const reply = response.data.choices[0].message.content;
                    stream.innerHTML += `<div class="msg-ai">${reply}</div>`;
                    saveChatToStorage(text, reply);
                } else {
                    stream.innerHTML += `<div class="msg-ai" style="color:#ff4444;">Error ${response.status}: Failed to reach gateway.</div>`;
                }
            } catch (err) {
                stream.innerHTML += `<div class="msg-ai" style="color:#ff4444;">System Error: ${err.message}</div>`;
            }
            stream.scrollTop = stream.scrollHeight;
        }

        function saveChatToStorage(userPrompt, aiResponse) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            history.unshift({ prompt: userPrompt, response: aiResponse, timestamp: new Date().toISOString() });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            loadSavedHistory();
        }

        function loadSavedHistory() {
            const list = document.getElementById("history-list");
            list.innerHTML = "";
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

            history.forEach((item) => {
                const li = document.createElement("li");
                li.className = "history-item";
                li.innerText = item.prompt;
                li.onclick = () => restoreSession(item);
                list.appendChild(li);
            });
        }

        function restoreSession(item) {
            document.getElementById("landing-view").style.display = "none";
            const stream = document.getElementById("chat-stream");
            stream.style.display = "flex";
            stream.innerHTML = `
                <div class="msg-user">${item.prompt}</div>
                <div class="msg-ai">${item.response}</div>
            `;
            toggleDrawer();
        }

        function clearSession() {
            document.getElementById("chat-stream").innerHTML = "";
            document.getElementById("chat-stream").style.display = "none";
            document.getElementById("landing-view").style.display = "flex";
        }
    </script>
</body>
</html>
